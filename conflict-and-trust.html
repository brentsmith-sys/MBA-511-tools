<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conflict and Trust — MBA@Rice 511</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cambria&display=swap" rel="stylesheet">
<style>
  :root { --navy:#00205B; --navy-tint:#EEF0F6; --gold:#A88B3D; --gold-tint:#FBF6EA; --grey:#58595B; --light:#F7F7F9; --border:#DEDFE5; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 40px; background:var(--light); font-family:'EB Garamond',Garamond,Baskerville,'Times New Roman',serif; color:#232326; font-size:19px; line-height:1.55; }
  h1,h2,h3 { font-family:'Cambria',Georgia,'Times New Roman',serif; }
  .wrap { max-width:680px; margin:0 auto; }
  .topbar { border-bottom:3px solid var(--gold); padding-bottom:10px; margin-bottom:18px; }
  .topbar .brand { font-family:'Cambria',Georgia,serif; font-weight:700; font-size:13px; letter-spacing:1.5px; color:var(--gold); text-transform:uppercase; }
  .card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:30px 30px 26px; box-shadow:0 2px 10px rgba(0,32,91,.06); animation:fadeIn .3s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .screen-title { font-size:24px; color:var(--navy); margin:0 0 10px; }
  .screen-body p { margin:0 0 14px; }
  .round-badge { font-family:'Cambria',Georgia,serif; font-weight:700; color:var(--gold); font-size:13px; text-transform:uppercase; letter-spacing:.5px; margin:0 0 6px; }

  .predict-options { display:flex; flex-direction:column; gap:10px; margin:16px 0; }
  .predict-option { text-align:left; padding:14px 18px; border:1px solid var(--border); border-radius:8px; background:#fff; font-family:'EB Garamond',serif; font-size:17px; cursor:pointer; transition:border-color .15s, background .15s; }
  .predict-option:hover { border-color:var(--navy); }
  .predict-option.chosen { border-color:var(--navy); background:var(--navy-tint); font-weight:600; }
  .predict-option:disabled { cursor:default; }

  .reveal-panel { display:none; margin-top:18px; padding:18px 20px; border-radius:8px; background:var(--gold-tint); border:1px solid #E9DDBE; animation:fadeIn .3s ease; }
  .reveal-panel.open { display:block; }
  .reveal-panel .rp-label { font-family:'Cambria',Georgia,serif; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--gold); display:block; margin-bottom:8px; }
  .reveal-panel p { margin:0 0 10px; }
  .reveal-panel p:last-child { margin-bottom:0; }
  .stat-line { font-family:'Cambria',Georgia,serif; font-weight:700; color:var(--navy); }

  .nav { display:flex; justify-content:flex-end; align-items:center; margin-top:24px; }
  .btn-next,.btn-start { font-family:'Cambria',Georgia,serif; font-weight:700; font-size:16px; border:none; border-radius:6px; padding:12px 26px; cursor:pointer; transition:background .15s; }
  .btn-next { background:var(--navy); color:#fff; }
  .btn-next:disabled { opacity:.35; cursor:not-allowed; }
  .btn-next:not(:disabled):hover { background:#001642; }
  .btn-start { background:var(--gold); color:#fff; }
  .footnote { text-align:center; color:var(--grey); font-size:13.5px; margin-top:22px; font-family:'Cambria',Georgia,serif; }
  @media (max-width:520px) { body{font-size:17px; padding:16px 10px 32px;} .card{padding:22px 18px 20px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><span class="brand">MBA@Rice 511 &middot; Session 4</span></div>
  <div class="card" id="card"></div>
  <div class="footnote">This page collects no data and requires no login &mdash; nothing here is submitted or graded.</div>
</div>

<script>
let screen = 'intro';
let round1Choice = null;
let round2Choice = null;

const card = document.getElementById('card');

function goTo(s) { screen = s; render(); }

function render() {
  if (screen === 'intro') renderIntro();
  else if (screen === 'round1') renderRound1();
  else if (screen === 'round2') renderRound2();
  else if (screen === 'synthesis') renderSynthesis();
}

function renderIntro() {
  card.innerHTML = `
    <h2 class="screen-title">Conflict and Trust</h2>
    <div class="screen-body">
      <p>Decades of team research make one argument confidently: disagreement about ideas and approaches &mdash; task conflict &mdash; makes teams smarter. More perspectives, better decisions.</p>
      <p>A well-designed study of roughly 300 management teams tested that argument directly. Predict what it found before you see it.</p>
    </div>
    <button class="btn-start" id="beginBtn">Begin</button>
  `;
  document.getElementById('beginBtn').addEventListener('click', () => goTo('round1'));
}

function renderRound1() {
  const options = [
    "Performance improves &mdash; more perspectives lead to better decisions",
    "Performance declines &mdash; conflict is still conflict, whatever it's about",
    "No real relationship &mdash; it depends entirely on other factors"
  ];
  card.innerHTML = `
    <p class="round-badge">Round 1</p>
    <h2 class="screen-title">Predict the finding</h2>
    <div class="screen-body"><p>As task conflict increases on a team, what happens to performance?</p></div>
    <div class="predict-options" id="options"></div>
    <div class="reveal-panel" id="reveal">
      <span class="rp-label">What the study found</span>
      <p><strong>Both</strong> task conflict and relationship conflict were negatively related to team performance. Not just personal conflict &mdash; disagreement about ideas and approaches too.</p>
      <p>That's a genuinely uncomfortable finding if you've spent years being told task conflict is the good kind. The study didn't stop there, though &mdash; it also measured something that turned out to change the whole picture.</p>
    </div>
    <div class="nav"><button class="btn-next" id="nextBtn" disabled>Continue &rarr;</button></div>
  `;
  const optsDiv = document.getElementById('options');
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'predict-option';
    btn.innerHTML = opt;
    btn.addEventListener('click', () => {
      if (round1Choice !== null) return;
      round1Choice = i;
      optsDiv.querySelectorAll('.predict-option').forEach(b => b.disabled = true);
      btn.classList.add('chosen');
      document.getElementById('reveal').classList.add('open');
      document.getElementById('nextBtn').disabled = false;
    });
    optsDiv.appendChild(btn);
  });
  document.getElementById('nextBtn').addEventListener('click', () => goTo('round2'));
}

function renderRound2() {
  const options = [
    "Trust doesn't change the relationship between conflict and performance",
    "In low-trust teams, task and relationship conflict are almost indistinguishable; in high-trust teams, they're clearly different",
    "High-trust teams simply have less conflict overall"
  ];
  card.innerHTML = `
    <p class="round-badge">Round 2</p>
    <h2 class="screen-title">Predict again</h2>
    <div class="screen-body"><p>The study also measured trust on each management team. Given what you just learned, what role does trust play?</p></div>
    <div class="predict-options" id="options"></div>
    <div class="reveal-panel" id="reveal">
      <span class="rp-label">What the study found</span>
      <p>In low-trust teams, the correlation between task conflict and relationship conflict was <span class="stat-line">0.8</span> &mdash; nearly a perfect overlap. Disagree about the budget, and it reads as a personal attack.</p>
      <p>In high-trust teams, that correlation was <span class="stat-line">0.05</span> &mdash; essentially unrelated. Task disagreement stayed task disagreement.</p>
      <p>The original hypothesis &mdash; task conflict helps, relationship conflict hurts &mdash; turns out to be true. It's just conditional on trust existing first. Without it, every disagreement gets read as personal, whatever it's actually about.</p>
    </div>
    <div class="nav"><button class="btn-next" id="nextBtn" disabled>Continue &rarr;</button></div>
  `;
  const optsDiv = document.getElementById('options');
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'predict-option';
    btn.innerHTML = opt;
    btn.addEventListener('click', () => {
      if (round2Choice !== null) return;
      round2Choice = i;
      optsDiv.querySelectorAll('.predict-option').forEach(b => b.disabled = true);
      btn.classList.add('chosen');
      document.getElementById('reveal').classList.add('open');
      document.getElementById('nextBtn').disabled = false;
    });
    optsDiv.appendChild(btn);
  });
  document.getElementById('nextBtn').addEventListener('click', () => goTo('synthesis'));
}

function renderSynthesis() {
  card.innerHTML = `
    <h2 class="screen-title">Why this comes first</h2>
    <div class="screen-body">
      <p>This is why psychological safety isn't a soft add-on to team effectiveness &mdash; it's the precondition for the one thing teams are actually for. A team with no trust can't safely disagree about anything, which means it can't use the different perspectives sitting in the room.</p>
      <p>Next: not just <em>whether</em> conflict happens, but <em>how</em> it happens &mdash; there's a real difference between a team that debates well and one that just argues.</p>
    </div>
  `;
}

render();
</script>
</body>
</html>
