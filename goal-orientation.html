<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goal Orientation at Work — MBA@Rice 511</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cambria&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #00205B; --navy-tint: #EEF0F6;
    --gold: #A88B3D; --gold-tint: #FBF6EA;
    --grey: #58595B; --light: #F7F7F9; --border: #DEDFE5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 40px; background: var(--light);
    font-family: 'EB Garamond', Garamond, Baskerville, 'Times New Roman', serif;
    color: #232326; font-size: 19px; line-height: 1.55;
  }
  h1, h2, h3, .heading-font { font-family: 'Cambria', Georgia, 'Times New Roman', serif; }
  .wrap { max-width: 720px; margin: 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid var(--gold); padding-bottom: 10px; margin-bottom: 18px; }
  .topbar .brand { font-family: 'Cambria', Georgia, serif; font-weight: 700; font-size: 13px; letter-spacing: 1.5px; color: var(--gold); text-transform: uppercase; }
  .topbar .progress-label { font-family: 'Cambria', Georgia, serif; font-size: 14px; color: var(--grey); }

  .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 30px 30px 26px; box-shadow: 0 2px 10px rgba(0,32,91,0.06); animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .screen-title { font-size: 24px; color: var(--navy); margin: 0 0 10px; }
  .screen-body p { margin: 0 0 14px; }

  .resume-banner { background: var(--navy-tint); border: 1px solid #D3D8E8; border-radius: 6px; padding: 16px 18px; margin-bottom: 18px; }
  .resume-banner p { margin: 0 0 12px; font-size: 17px; }
  .resume-actions { display: flex; gap: 10px; }

  .btn-start, .btn-copy, .btn-see-results { background: var(--gold); color: #fff; }
  .btn-restart, .btn-fresh { background: #fff; color: var(--navy); border: 1px solid var(--navy); }
  .btn-resume { background: var(--navy); color: #fff; }
  .btn-download { background: #fff; color: var(--grey); border: 1px solid var(--border); font-size: 14px; padding: 9px 18px; }
  .btn-start, .btn-copy, .btn-restart, .btn-fresh, .btn-resume, .btn-download, .btn-see-results {
    font-family: 'Cambria', Georgia, serif; font-weight: 700; font-size: 16px; border: none; border-radius: 6px; padding: 12px 26px; cursor: pointer; transition: opacity 0.2s, background 0.15s;
  }
  .btn-see-results:disabled { opacity: 0.35; cursor: not-allowed; background: var(--grey); }

  .scale-legend {
    display: flex; flex-wrap: wrap; gap: 4px 14px;
    font-size: 13.5px; color: var(--grey); font-family: 'Cambria', Georgia, serif;
    background: var(--light); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; margin-bottom: 20px;
  }
  .scale-legend span strong { color: var(--navy); }

  .item-block { margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .item-block:last-of-type { border-bottom: none; }
  .item-text { margin: 0 0 12px; font-size: 18px; }
  .item-number { color: var(--gold); font-weight: 700; font-family: 'Cambria', Georgia, serif; margin-right: 6px; }

  .scale-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .scale-btn {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
    font-family: 'Cambria', Georgia, serif; font-weight: 700; font-size: 16px; color: var(--grey);
    cursor: pointer; transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .scale-btn:hover { border-color: var(--navy); }
  .scale-btn.selected { border-color: var(--gold); background: var(--gold-tint); color: var(--gold); }

  .completion-row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; position: sticky; bottom: 0; background: #fff; padding-top: 14px; }
  .completion-count { font-family: 'Cambria', Georgia, serif; color: var(--grey); font-size: 15px; }
  .completion-count.met { color: var(--gold); font-weight: 700; }

  .score-cards { display: flex; flex-direction: column; gap: 14px; margin: 18px 0 20px; }
  .score-card { border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
  .score-card .label { font-family: 'Cambria', Georgia, serif; font-weight: 700; color: var(--navy); font-size: 15px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .score-card .value { font-family: 'Cambria', Georgia, serif; font-weight: 700; color: var(--gold); font-size: 26px; margin-bottom: 8px; }
  .score-bar-track { background: var(--light); border-radius: 4px; height: 10px; overflow: hidden; }
  .score-bar-fill { background: var(--gold); height: 100%; border-radius: 4px; transition: width 0.4s ease; }

  .output-box { width: 100%; min-height: 300px; padding: 16px; border: 1px solid var(--border); border-radius: 6px; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.5; color: #232326; background: var(--light); white-space: pre-wrap; resize: vertical; }
  .copy-row { display: flex; align-items: center; gap: 12px; margin: 14px 0 6px; flex-wrap: wrap; }
  .copy-confirm { color: var(--gold); font-weight: 700; font-family: 'Cambria', Georgia, serif; font-size: 15px; opacity: 0; transition: opacity 0.2s; }
  .copy-confirm.shown { opacity: 1; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }

  .footnote { text-align: center; color: var(--grey); font-size: 13.5px; margin-top: 22px; font-family: 'Cambria', Georgia, serif; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 16px 10px 32px; }
    .card { padding: 22px 16px 20px; }
    .item-text { font-size: 16px; }
    .scale-btn { font-size: 14px; }
    .scale-legend { font-size: 12px; gap: 3px 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand">MBA@Rice 511 &middot; Session 1</span>
    <span class="progress-label" id="progressLabel"></span>
  </div>
  <div class="card" id="card"></div>
  <div class="footnote">This page collects no data and requires no login. Everything you answer stays in this browser until you copy or download it yourself.</div>
</div>

<script>
const STORAGE_KEY = 'rice511_goal_orientation_v1';

const SCALE = [
  { v: 1, label: 'Strongly disagree' },
  { v: 2, label: 'Disagree' },
  { v: 3, label: 'Sort of disagree' },
  { v: 4, label: 'Neither' },
  { v: 5, label: 'Sort of agree' },
  { v: 6, label: 'Agree' },
  { v: 7, label: 'Strongly agree' }
];

const ITEMS = [
  "I am willing to select a challenging work assignment that I can learn a lot from.",
  "I often look for opportunities to develop new skills and knowledge.",
  "I enjoy challenging and difficult tasks at work where I'll learn new skills.",
  "For me, further development of my work ability is important enough to take risks.",
  "I like to show that I can perform better than my co-workers.",
  "I try to figure out what it takes to prove my ability to others at work.",
  "I enjoy it when others at work are aware of how well I am doing.",
  "I prefer to work on projects where I can prove my ability to others.",
  "I would avoid taking on a new task if there was a chance that I would appear rather incompetent to others.",
  "Avoiding a show of low ability is more important to me than learning a new skill.",
  "I'm concerned about taking on a task at work if my performance would reveal that I had low ability.",
  "I prefer to avoid situations at work where I might perform poorly."
];

const COUNT = ITEMS.length;
let screen = 'intro';
let responses = new Array(COUNT).fill(null);

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ responses })); } catch (e) {}
}
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function clearState() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }

const card = document.getElementById('card');
const progressLabel = document.getElementById('progressLabel');

function answeredCount() { return responses.filter((v) => v !== null).length; }
function allAnswered() { return answeredCount() === COUNT; }

function updateLabel() {
  if (screen === 'intro') progressLabel.textContent = '';
  else if (screen === 'complete') progressLabel.textContent = 'Complete';
  else progressLabel.textContent = answeredCount() + ' of ' + COUNT + ' answered';
}

function renderIntro() {
  screen = 'intro';
  updateLabel();
  const saved = loadState();
  const hasSaved = saved && (saved.responses || []).some((v) => v !== null);

  let resumeHtml = '';
  if (hasSaved) {
    resumeHtml = `
      <div class="resume-banner">
        <p><strong>We found saved progress in this browser from a previous session.</strong></p>
        <div class="resume-actions">
          <button class="btn-resume" id="resumeBtn">Resume where I left off</button>
          <button class="btn-fresh" id="freshBtn">Start fresh</button>
        </div>
      </div>
    `;
  }

  card.innerHTML = `
    <h2 class="screen-title">Goal Orientation at Work</h2>
    <div class="screen-body">
      ${resumeHtml}
      <p>Individuals have different views about how they approach work. Read each statement and select the response that reflects how much you agree or disagree.</p>
      <p>Answer honestly rather than how you'd like to be seen &mdash; there's no version of this where one profile is the "right" one, and your own results are shown to you immediately at the end.</p>
    </div>
    <button class="btn-start" id="beginBtn">${hasSaved ? 'Start fresh instead' : 'Begin'}</button>
  `;

  if (hasSaved) {
    document.getElementById('resumeBtn').addEventListener('click', () => {
      responses = saved.responses.slice(0, COUNT);
      while (responses.length < COUNT) responses.push(null);
      renderForm();
    });
    document.getElementById('freshBtn').addEventListener('click', startFresh);
    document.getElementById('beginBtn').addEventListener('click', startFresh);
  } else {
    document.getElementById('beginBtn').addEventListener('click', renderForm);
  }
}

function startFresh() {
  responses = new Array(COUNT).fill(null);
  clearState();
  renderForm();
}

function renderForm() {
  screen = 'form';
  updateLabel();

  const legendHtml = SCALE.map((s) => `<span><strong>${s.v}</strong> ${s.label}</span>`).join('');

  let itemsHtml = '';
  for (let i = 0; i < COUNT; i++) {
    const buttons = SCALE.map((s) => `
      <button class="scale-btn${responses[i] === s.v ? ' selected' : ''}" data-item="${i}" data-value="${s.v}" title="${s.label}">${s.v}</button>
    `).join('');
    itemsHtml += `
      <div class="item-block">
        <p class="item-text"><span class="item-number">${i + 1}.</span>${ITEMS[i]}</p>
        <div class="scale-row" data-row="${i}">${buttons}</div>
      </div>
    `;
  }

  card.innerHTML = `
    <h3 class="screen-title" style="font-size:21px;">Rate each statement</h3>
    <div class="scale-legend">${legendHtml}</div>
    ${itemsHtml}
    <div class="completion-row">
      <span class="completion-count" id="completionCount"></span>
      <button class="btn-see-results" id="seeResultsBtn" disabled>See my results &rarr;</button>
    </div>
  `;

  card.querySelectorAll('.scale-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const item = parseInt(btn.getAttribute('data-item'), 10);
      const value = parseInt(btn.getAttribute('data-value'), 10);
      responses[item] = value;
      updateRowUI(item);
      updateCompletion();
      saveState();
    });
  });

  updateCompletion();
  document.getElementById('seeResultsBtn').addEventListener('click', renderComplete);
}

function updateRowUI(itemIndex) {
  const row = card.querySelector('.scale-row[data-row="' + itemIndex + '"]');
  row.querySelectorAll('.scale-btn').forEach((btn) => {
    const value = parseInt(btn.getAttribute('data-value'), 10);
    btn.classList.toggle('selected', responses[itemIndex] === value);
  });
}

function updateCompletion() {
  const n = answeredCount();
  const label = document.getElementById('completionCount');
  const btn = document.getElementById('seeResultsBtn');
  label.textContent = n + ' of ' + COUNT + ' answered';
  label.className = 'completion-count' + (n === COUNT ? ' met' : '');
  btn.disabled = n !== COUNT;
  updateLabel();
}

function average(indices) {
  const sum = indices.reduce((acc, i) => acc + responses[i], 0);
  return sum / indices.length;
}

function computeScores() {
  return {
    learning: average([0, 1, 2, 3]),
    proving: average([4, 5, 6, 7]),
    avoiding: average([8, 9, 10, 11])
  };
}

function renderComplete() {
  screen = 'complete';
  updateLabel();
  const scores = computeScores();
  const text = compileOutput(scores);

  function bar(score) {
    const pct = ((score - 1) / 6) * 100;
    return pct.toFixed(0);
  }

  card.innerHTML = `
    <h2 class="screen-title">Your profile</h2>
    <div class="screen-body">
      <p>These are your own averages on the three dimensions. Nothing here is being compared to anyone else's, and there's no target score.</p>
    </div>
    <div class="score-cards">
      <div class="score-card">
        <div class="label">Learning</div>
        <div class="value">${scores.learning.toFixed(2)} / 7</div>
        <div class="score-bar-track"><div class="score-bar-fill" style="width:${bar(scores.learning)}%"></div></div>
      </div>
      <div class="score-card">
        <div class="label">Proving</div>
        <div class="value">${scores.proving.toFixed(2)} / 7</div>
        <div class="score-bar-track"><div class="score-bar-fill" style="width:${bar(scores.proving)}%"></div></div>
      </div>
      <div class="score-card">
        <div class="label">Avoiding</div>
        <div class="value">${scores.avoiding.toFixed(2)} / 7</div>
        <div class="score-bar-track"><div class="score-bar-fill" style="width:${bar(scores.avoiding)}%"></div></div>
      </div>
    </div>
    <div class="screen-body">
      <p>Keep these three numbers in mind. The next page explains what they mean and where they come from &mdash; copy your response below and paste it into the assignment first.</p>
    </div>
    <div class="copy-row">
      <button class="btn-copy" id="copyBtn">Copy everything</button>
      <button class="btn-download" id="downloadBtn">Download a copy for yourself</button>
      <span class="copy-confirm" id="copyConfirm">Copied &mdash; now paste it into Canvas</span>
    </div>
    <textarea class="output-box" id="outputBox" readonly>${escapeHtml(text)}</textarea>
    <div class="nav"><button class="btn-restart" id="restartBtn">Go back and edit</button><span></span></div>
  `;

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const box = document.getElementById('outputBox');
    let copied = false;
    try { await navigator.clipboard.writeText(text); copied = true; }
    catch (e) {
      try { box.focus(); box.select(); document.execCommand('copy'); copied = true; }
      catch (e2) {}
    }
    if (copied) {
      const c = document.getElementById('copyConfirm');
      c.classList.add('shown');
      setTimeout(() => c.classList.remove('shown'), 3000);
    } else { box.focus(); box.select(); }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'goal-orientation-profile.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('restartBtn').addEventListener('click', renderForm);
}

function compileOutput(scores) {
  const lines = ['GOAL ORIENTATION AT WORK', ''];
  for (let i = 0; i < COUNT; i++) {
    lines.push((i + 1) + '. [' + responses[i] + '] ' + ITEMS[i]);
  }
  lines.push('');
  lines.push('SCORES');
  lines.push('Learning orientation (avg of items 1\u20134): ' + scores.learning.toFixed(2));
  lines.push('Proving orientation (avg of items 5\u20138): ' + scores.proving.toFixed(2));
  lines.push('Avoiding orientation (avg of items 9\u201312): ' + scores.avoiding.toFixed(2));
  return lines.join('\n');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderIntro();
</script>
</body>
</html>
