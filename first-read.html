<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Read — MBA@Rice 511</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cambria&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #00205B; --navy-tint: #EEF0F6;
    --gold: #A88B3D; --gold-tint: #FBF6EA;
    --grey: #58595B; --light: #F7F7F9; --border: #DEDFE5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 40px; background: var(--light); font-family: 'EB Garamond', Garamond, Baskerville, 'Times New Roman', serif; color: #232326; font-size: 19px; line-height: 1.55; }
  h1, h2, h3 { font-family: 'Cambria', Georgia, 'Times New Roman', serif; }
  .wrap { max-width: 700px; margin: 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid var(--gold); padding-bottom: 10px; margin-bottom: 18px; }
  .topbar .brand { font-family: 'Cambria', Georgia, serif; font-weight: 700; font-size: 13px; letter-spacing: 1.5px; color: var(--gold); text-transform: uppercase; }
  .topbar .progress-label { font-family: 'Cambria', Georgia, serif; font-size: 14px; color: var(--grey); }

  .dots { display: flex; gap: 7px; justify-content: center; margin-bottom: 22px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #D6D8E0; border: none; padding: 0; cursor: default; transition: background 0.2s, transform 0.15s; }
  .dot.visited { background: var(--navy); cursor: pointer; }
  .dot.current { background: var(--gold); transform: scale(1.3); cursor: pointer; }

  .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 30px 30px 26px; box-shadow: 0 2px 10px rgba(0,32,91,0.06); min-height: 280px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .step-number { font-family: 'Cambria', Georgia, serif; font-weight: 700; color: var(--gold); font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase; margin: 0 0 6px; }
  .step-title { font-family: 'Cambria', Georgia, serif; font-weight: 700; color: var(--navy); font-size: 21px; margin: 0 0 14px; }
  .step-prompt { margin: 0 0 16px; }
  .step-prompt em { color: var(--grey); }

  textarea.answer { width: 100%; min-height: 110px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 18px; line-height: 1.5; color: #232326; resize: vertical; }
  textarea.answer:focus { outline: none; border-color: var(--navy); }
  .counter { display: flex; justify-content: flex-end; margin-top: 6px; font-family: 'Cambria', Georgia, serif; font-size: 14px; color: var(--grey); }
  .counter.met { color: var(--gold); font-weight: 700; }

  /* 100-point split */
  .split-rows { display: flex; flex-direction: column; gap: 12px; margin: 4px 0 6px; }
  .split-row { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  .split-row label { font-family: 'Cambria', Georgia, serif; font-weight: 700; color: var(--navy); font-size: 16px; }
  .split-row .sub { display: block; font-family: 'EB Garamond', serif; font-weight: 400; color: var(--grey); font-size: 14px; margin-top: 2px; }
  .split-input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 5px; font-family: 'Cambria', Georgia, serif; font-weight: 700; font-size: 18px; text-align: center; }
  .split-input:focus { outline: none; border-color: var(--navy); }
  .split-total { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 6px; margin-top: 6px; font-family: 'Cambria', Georgia, serif; font-weight: 700; background: var(--navy-tint); }
  .split-total.met { background: var(--gold-tint); color: var(--gold); }
  .split-total .amt { font-size: 20px; }

  /* decision buttons */
  .choice-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .choice-btn { display: block; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-family: inherit; font-size: 18px; color: #232326; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .choice-btn:hover { border-color: var(--navy); }
  .choice-btn.selected { border-color: var(--gold); background: var(--gold-tint); }

  /* confidence slider */
  .slider-wrap { margin: 20px 0 6px; }
  input[type="range"] { width: 100%; height: 6px; -webkit-appearance: none; background: var(--border); border-radius: 4px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--gold); }
  input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--gold); }
  .slider-value { text-align: center; font-family: 'Cambria', Georgia, serif; font-weight: 700; color: var(--navy); font-size: 28px; margin-top: 10px; }
  .slider-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--grey); font-family: 'Cambria', Georgia, serif; margin-top: 4px; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  .btn-next, .btn-start, .btn-restart, .btn-copy, .btn-download, .btn-resume, .btn-fresh {
    font-family: 'Cambria', Georgia, serif; font-weight: 700; font-size: 16px; border: none; border-radius: 6px; padding: 12px 26px; cursor: pointer; transition: opacity 0.2s, background 0.15s;
  }
  .btn-next { background: var(--navy); color: #fff; }
  .btn-next:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-next:not(:disabled):hover { background: #001642; }
  .btn-start, .btn-copy { background: var(--gold); color: #fff; }
  .btn-restart, .btn-fresh { background: #fff; color: var(--navy); border: 1px solid var(--navy); }
  .btn-resume { background: var(--navy); color: #fff; }
  .btn-download { background: #fff; color: var(--grey); border: 1px solid var(--border); font-size: 14px; padding: 9px 18px; }

  .screen-title { font-size: 24px; color: var(--navy); margin: 0 0 10px; }
  .screen-body p { margin: 0 0 14px; }

  .resume-banner { background: var(--navy-tint); border: 1px solid #D3D8E8; border-radius: 6px; padding: 16px 18px; margin-bottom: 18px; }
  .resume-banner p { margin: 0 0 12px; font-size: 17px; }
  .resume-actions { display: flex; gap: 10px; }

  .output-box { width: 100%; min-height: 260px; padding: 16px; border: 1px solid var(--border); border-radius: 6px; font-family: 'Courier New', monospace; font-size: 14.5px; line-height: 1.5; color: #232326; background: var(--light); white-space: pre-wrap; resize: vertical; }
  .copy-row { display: flex; align-items: center; gap: 12px; margin: 14px 0 6px; flex-wrap: wrap; }
  .copy-confirm { color: var(--gold); font-weight: 700; font-family: 'Cambria', Georgia, serif; font-size: 15px; opacity: 0; transition: opacity 0.2s; }
  .copy-confirm.shown { opacity: 1; }

  .footnote { text-align: center; color: var(--grey); font-size: 13.5px; margin-top: 22px; font-family: 'Cambria', Georgia, serif; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 16px 10px 32px; }
    .card { padding: 22px 18px 20px; }
    textarea.answer { font-size: 16px; }
    .split-row { grid-template-columns: 1fr 74px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand">MBA@Rice 511 &middot; Session 3</span>
    <span class="progress-label" id="progressLabel"></span>
  </div>
  <div class="dots" id="dots"></div>
  <div class="card" id="card"></div>
  <div class="footnote">This page collects no data and requires no login. Everything you write stays in this browser until you copy or download it yourself.</div>
</div>

<script>
const STORAGE_KEY = 'rice511_first_read_v1';

const BUCKETS = [
  { key: 'brodsky', label: 'Brodsky', sub: 'his personality, ability, motivation, work style, or fit for the role' },
  { key: 'keller', label: 'Keller', sub: 'how he has managed, evaluated, communicated with, and related to Brodsky' },
  { key: 'situation', label: 'The situation', sub: 'unclear expectations, resources, market conditions, the strategy itself' },
  { key: 'haussler', label: 'Häussler and the parent company', sub: 'how the assignment was set up and supervised' }
];

const DECISIONS = [
  'Fire, or withhold the raise',
  'Restructure and split the role',
  'Invest in improving performance'
];

const STEPS = ['split', 'hypothesis', 'decision', 'confidence', 'obstacle'];
const TOTAL = STEPS.length;

let current = -1;
let furthest = -1;
let answers = { split: { brodsky: '', keller: '', situation: '', haussler: '' }, hypothesis: '', decision: null, confidence: 50, obstacle: '' };

function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers, furthest })); } catch (e) {} }
function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function clearState() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }

const card = document.getElementById('card');
const dotsEl = document.getElementById('dots');
const progressLabel = document.getElementById('progressLabel');

function splitTotal() {
  return BUCKETS.reduce((sum, b) => sum + (parseInt(answers.split[b.key], 10) || 0), 0);
}
function splitValid() {
  const allFilled = BUCKETS.every(b => answers.split[b.key] !== '' && answers.split[b.key] !== null && !isNaN(parseInt(answers.split[b.key], 10)));
  return allFilled && splitTotal() === 100;
}

function isStepComplete(stepKey) {
  if (stepKey === 'split') return splitValid();
  if (stepKey === 'hypothesis') return answers.hypothesis.trim().length >= 15;
  if (stepKey === 'decision') return answers.decision !== null;
  if (stepKey === 'confidence') return true;
  if (stepKey === 'obstacle') return answers.obstacle.trim().length >= 15;
  return false;
}

function renderDots() {
  dotsEl.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('button');
    d.className = 'dot';
    if (i === current) d.className += ' current';
    else if (i <= furthest) d.className += ' visited';
    d.setAttribute('aria-label', 'Step ' + (i + 1));
    if (i <= furthest) d.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(d);
  }
}
function updateProgressLabel() {
  if (current < 0) progressLabel.textContent = '';
  else if (current >= TOTAL) progressLabel.textContent = 'Complete';
  else progressLabel.textContent = 'Step ' + (current + 1) + ' of ' + TOTAL;
}
function goTo(index) {
  current = index;
  if (index > furthest) furthest = index;
  updateProgressLabel();
  renderDots();
  if (index === -1) renderIntro();
  else if (index >= TOTAL) renderComplete();
  else renderStep(STEPS[index]);
}

function renderIntro() {
  const saved = loadState();
  const hasSaved = saved && (splitTotalFrom(saved.answers) > 0 || (saved.answers.hypothesis || '').length > 0);
  let resumeHtml = '';
  if (hasSaved) {
    resumeHtml = `
      <div class="resume-banner">
        <p><strong>We found saved progress in this browser from a previous session.</strong></p>
        <div class="resume-actions">
          <button class="btn-resume" id="resumeBtn">Resume where I left off</button>
          <button class="btn-fresh" id="freshBtn">Start fresh</button>
        </div>
      </div>
    `;
  }

  card.innerHTML = `
    <h2 class="screen-title">First Read</h2>
    <div class="screen-body">
      ${resumeHtml}
      <p>You've just read the Keller case for the first time. Before any video, before any framework &mdash; I want your instinctive read on record.</p>
      <p>There are no right answers here and this isn't graded for accuracy. Answer quickly, from your first impression. Your responses come back to you later in the session.</p>
    </div>
    <button class="btn-start" id="beginBtn">${hasSaved ? 'Start fresh instead' : 'Begin'}</button>
  `;

  if (hasSaved) {
    document.getElementById('resumeBtn').addEventListener('click', () => {
      answers = saved.answers;
      furthest = typeof saved.furthest === 'number' ? saved.furthest : -1;
      const firstIncomplete = STEPS.findIndex((s) => !isStepComplete(s));
      goTo(firstIncomplete === -1 ? TOTAL : firstIncomplete);
    });
    document.getElementById('freshBtn').addEventListener('click', startFresh);
    document.getElementById('beginBtn').addEventListener('click', startFresh);
  } else {
    document.getElementById('beginBtn').addEventListener('click', () => goTo(0));
  }
}
function splitTotalFrom(a) {
  return BUCKETS.reduce((sum, b) => sum + (parseInt(a.split[b.key], 10) || 0), 0);
}

function startFresh() {
  answers = { split: { brodsky: '', keller: '', situation: '', haussler: '' }, hypothesis: '', decision: null, confidence: 50, obstacle: '' };
  furthest = -1;
  clearState();
  goTo(0);
}

function renderStep(stepKey) {
  if (stepKey === 'split') { renderSplit(); return; }
  if (stepKey === 'decision') { renderDecision(); return; }
  if (stepKey === 'confidence') { renderConfidence(); return; }
  renderTextStep(stepKey);
}

function renderSplit() {
  const rows = BUCKETS.map(b => `
    <div class="split-row">
      <label for="split-${b.key}">${b.label}<span class="sub">${b.sub}</span></label>
      <input type="number" id="split-${b.key}" class="split-input" min="0" max="100"
             value="${answers.split[b.key]}" placeholder="0">
    </div>
  `).join('');

  card.innerHTML = `
    <p class="step-number">Step 1 of 5</p>
    <h3 class="step-title">Where does the cause sit?</h3>
    <p class="step-prompt">Brodsky is not performing to Keller's expectations. Distribute <strong>100 points</strong> across these four explanations, according to how much each contributes. They must total 100.</p>
    <div class="split-rows">${rows}</div>
    <div class="split-total" id="splitTotal"><span>Total</span><span class="amt" id="splitAmt">0 / 100</span></div>
    <div class="nav"><span></span><button class="btn-next" id="nextBtn" disabled>Next &rarr;</button></div>
  `;

  const nextBtn = document.getElementById('nextBtn');
  function refresh() {
    BUCKETS.forEach(b => { answers.split[b.key] = document.getElementById('split-' + b.key).value; });
    const total = splitTotal();
    const amt = document.getElementById('splitAmt');
    const totalBox = document.getElementById('splitTotal');
    amt.textContent = total + ' / 100';
    const valid = splitValid();
    totalBox.className = 'split-total' + (valid ? ' met' : '');
    nextBtn.disabled = !valid;
    saveState();
  }
  BUCKETS.forEach(b => document.getElementById('split-' + b.key).addEventListener('input', refresh));
  refresh();
  nextBtn.addEventListener('click', () => goTo(current + 1));
}

function renderDecision() {
  const btns = DECISIONS.map((d, i) => `
    <button class="choice-btn${answers.decision === i ? ' selected' : ''}" data-idx="${i}">${d}</button>
  `).join('');

  card.innerHTML = `
    <p class="step-number">Step 3 of 5</p>
    <h3 class="step-title">The decision</h3>
    <p class="step-prompt">Which option should Keller choose?</p>
    <div class="choice-list" id="choiceList">${btns}</div>
    <div class="nav"><span></span><button class="btn-next" id="nextBtn" ${answers.decision !== null ? '' : 'disabled'}>Next &rarr;</button></div>
  `;

  card.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      answers.decision = parseInt(btn.getAttribute('data-idx'), 10);
      card.querySelectorAll('.choice-btn').forEach(b => {
        b.classList.toggle('selected', parseInt(b.getAttribute('data-idx'), 10) === answers.decision);
      });
      document.getElementById('nextBtn').disabled = false;
      saveState();
    });
  });
  document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
}

function renderConfidence() {
  card.innerHTML = `
    <p class="step-number">Step 4 of 5</p>
    <h3 class="step-title">Confidence</h3>
    <p class="step-prompt">How confident are you in that choice?</p>
    <div class="slider-wrap">
      <input type="range" id="confSlider" min="0" max="100" step="1" value="${answers.confidence}">
      <div class="slider-value" id="confValue">${answers.confidence}</div>
      <div class="slider-labels"><span>Not at all</span><span>Completely certain</span></div>
    </div>
    <div class="nav"><span></span><button class="btn-next" id="nextBtn">Next &rarr;</button></div>
  `;
  const slider = document.getElementById('confSlider');
  const val = document.getElementById('confValue');
  slider.addEventListener('input', () => {
    answers.confidence = parseInt(slider.value, 10);
    val.textContent = answers.confidence;
    saveState();
  });
  document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
}

function renderTextStep(stepKey) {
  const config = {
    hypothesis: {
      num: 'Step 2 of 5', title: 'Your primary hypothesis',
      prompt: 'In one sentence: why is Brodsky underperforming?<br><br><em>One sentence, but a real one &mdash; specific enough that someone reading only this would know what you actually think is going on.</em>',
      min: 50
    },
    obstacle: {
      num: 'Step 5 of 5', title: 'The obstacle',
      prompt: 'What is the single biggest difficulty Keller would face executing your choice?',
      min: 120
    }
  }[stepKey];

  card.innerHTML = `
    <p class="step-number">${config.num}</p>
    <h3 class="step-title">${config.title}</h3>
    <p class="step-prompt">${config.prompt}</p>
    <textarea class="answer" id="answerBox" style="min-height:90px;" placeholder="Start typing...">${escapeHtml(answers[stepKey])}</textarea>
    <div class="counter" id="counter"></div>
    <div class="nav"><span></span><button class="btn-next" id="nextBtn" disabled>Next &rarr;</button></div>
  `;
  const box = document.getElementById('answerBox');
  const counter = document.getElementById('counter');
  const nextBtn = document.getElementById('nextBtn');
  function refresh() {
    const len = box.value.trim().length;
    const met = len >= config.min;
    counter.textContent = met ? 'Looks good' : 'A few more words';
    counter.className = 'counter' + (met ? ' met' : '');
    nextBtn.disabled = !met;
    answers[stepKey] = box.value;
    saveState();
  }
  box.addEventListener('input', refresh);
  refresh();
  nextBtn.addEventListener('click', () => goTo(current + 1));
}

function renderComplete() {
  const text = compileOutput();
  card.innerHTML = `
    <h2 class="screen-title">Recorded.</h2>
    <div class="screen-body">
      <p>Copy everything below and paste it as your submission for the <strong>First Read</strong> assignment in Canvas.</p>
    </div>
    <div class="copy-row">
      <button class="btn-copy" id="copyBtn">Copy everything</button>
      <button class="btn-download" id="downloadBtn">Download a copy</button>
      <span class="copy-confirm" id="copyConfirm">Copied &mdash; now paste it into Canvas</span>
    </div>
    <textarea class="output-box" id="outputBox" readonly>${escapeHtml(text)}</textarea>
    <div class="nav"><button class="btn-restart" id="restartBtn">Go back and edit</button><span></span></div>
  `;

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const box = document.getElementById('outputBox');
    let copied = false;
    try { await navigator.clipboard.writeText(text); copied = true; }
    catch (e) { try { box.focus(); box.select(); document.execCommand('copy'); copied = true; } catch (e2) {} }
    if (copied) {
      const c = document.getElementById('copyConfirm');
      c.classList.add('shown');
      setTimeout(() => c.classList.remove('shown'), 3000);
    } else { box.focus(); box.select(); }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'first-read.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('restartBtn').addEventListener('click', () => goTo(TOTAL - 1));
}

function compileOutput() {
  const lines = ['FIRST READ — THE KELLER CASE', ''];
  lines.push('Where the cause sits (100 points distributed):');
  BUCKETS.forEach(b => lines.push('  ' + b.label + ': ' + (answers.split[b.key] || 0)));
  lines.push('');
  lines.push('Primary hypothesis:');
  lines.push(answers.hypothesis.trim());
  lines.push('');
  lines.push('Decision: ' + (answers.decision !== null ? DECISIONS[answers.decision] : '(not set)'));
  lines.push('Confidence: ' + answers.confidence + ' / 100');
  lines.push('');
  lines.push('Biggest obstacle to executing that choice:');
  lines.push(answers.obstacle.trim());
  return lines.join('\n');
}

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

goTo(-1);
</script>
</body>
</html>
